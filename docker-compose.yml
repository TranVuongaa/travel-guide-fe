services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
    image: ${IMAGE_NAME:-travel-guide-fe}:${IMAGE_TAG:-latest}
    container_name: travel-guide-fe
    restart: unless-stopped
    ports:
      - "3001:3000"
    env_file:
      - .env
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:3000"]
      interval: 30s
      timeout: 5s
      retries: 3
